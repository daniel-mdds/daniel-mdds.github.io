<section id="cap-hoje" data-chapter="0" style="background: #FFFFFF; color: #11151C; padding: 48px clamp(16px, 5cqi, 80px) clamp(64px, 8cqi, 128px) clamp(12px, 3cqi, 40px)">
<div class="dm-hintrow" style="margin: 0 0 20px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #4A5363"><span class="dm-pt">Hoje · Ânima Educação</span><span class="dm-en">Today · Ânima Educação</span></p>
<p style="margin: 0; font-size: 15px; font-weight: 600; color: #4A5363"><span class="dm-pt">Role para voltar no tempo ↓</span><span class="dm-en">Scroll to go back in time ↓</span></p>
</div>
<h1 style="margin: 0 0 28px; font-size: clamp(30px, 4.4cqi, 56px); line-height: 1.08; letter-spacing: -0.025em; font-weight: 800; max-width: 20ch"><span class="dm-pt">Hoje eu sou Product Designer/Owner, unindo UX, UI e gestão de produto.</span><span class="dm-en">Today I am a Product Designer/Owner, combining UX, UI and product management.</span></h1>
<div>
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 760px">
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">Sou Product Designer/Owner em um dos times da Ânima Educação que cuidam do desenvolvimento dos produtos e plataformas digitais da companhia. Reúno as duas frentes: o olhar de UX/UI Designer segue presente na forma como conduzo o produto.</span><span class="dm-en">I am a Product Designer/Owner in one of the teams at Ânima Educação that develop the company’s digital products and platforms. I combine both fronts: my UX/UI Design perspective still shapes how I run the product.</span></p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">Escrevo User Stories, conduzo as reuniões com o time, homologo cards no Azure DevOps e tomo as decisões de produto junto ao time. Do design, mantenho a prototipação, os testes com usuários e os arquivos de handoff. Também uso inteligência artificial nos processos e fluxos de trabalho do dia a dia, com ferramentas como Figma Make, Copilot e Claude.</span><span class="dm-en">I write User Stories, lead team meetings, sign off cards in Azure DevOps and make product decisions together with the team. From design, I keep prototyping, user testing and handoff files. I also use artificial intelligence in my everyday processes and workflows, with tools such as Figma Make, Copilot and Claude.</span></p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">É assim que eu vejo quem trabalha com produto e tecnologia digital hoje: não um cargo de uma competência só, mas um mix de competências técnicas entre design e produto.</span><span class="dm-en">That is how I see anyone working in product and digital technology today: not a single-skill role, but a mix of technical skills spanning design and product.</span></p>
<ul aria-label="{{tx.comp}}" style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; font-weight: 600">
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC">User Stories</li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Homologação no Azure DevOps</span><span class="dm-en">Acceptance in Azure DevOps</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Condução de reuniões</span><span class="dm-en">Meeting facilitation</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Decisões de produto</span><span class="dm-en">Product decisions</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Prototipação e testes</span><span class="dm-en">Prototyping and testing</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC">Handoff</li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">IA no fluxo de trabalho</span><span class="dm-en">AI in the workflow</span></li>
</ul>
</div>
<div style="margin-top: 56px">
<ul class="dm-cards2" style="list-style: none; margin: 0; padding: 0; gap: 40px 32px">
<li style="display: flex; flex-direction: column; gap: 12px"><img src="images/habilitacao-docente.jpg" alt="Telas da Habilitação docente: informar disponibilidade, confirmar indicações e assinar extrato de carga horária" style="display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 12px"><h3 style="margin: 0; font-size: 20px; font-weight: 700"><span class="dm-pt">Jornada de habilitação docente</span><span class="dm-en">Teacher qualification journey</span></h3><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5363"><span class="dm-pt">Unificação sistêmica e operacional da atribuição de aulas aos docentes, em três etapas, com participação ativa de todos os atores do processo e integração com sistemas parceiros.</span><span class="dm-en">A systemic and operational unification of how classes are assigned to teachers, in three stages, with every stakeholder actively involved and integration with partner systems.</span></p>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5363"><span class="dm-pt">O produto organiza e documenta o fluxo de atribuição dos componentes curriculares, com rastreabilidade e poder de decisão para os stakeholders. Tem como objetivos estratégicos aproveitar melhor o quadro de funcionários, melhorar a oferta de disciplinas e evitar gastos trabalhistas excessivos.</span><span class="dm-en">The product organizes and documents the flow of course assignments, with traceability and decision power for stakeholders. Its strategic goals are to make better use of the staff, improve course offerings and avoid excessive labor costs.</span></p>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5363"><span class="dm-pt">Quando implementada, a primeira etapa atingiu mais de 90% de top two box na avaliação de CSAT, com adesão expressiva de respondentes.</span><span class="dm-en">When launched, the first stage reached a CSAT top-two-box score above 90%, with a strong response rate.</span></p></li>
<li style="display: flex; flex-direction: column; gap: 12px"><img src="images/quadro-de-aulas.jpg" alt="Quadro de aulas em desktop e mobile" style="display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 12px"><h3 style="margin: 0; font-size: 20px; font-weight: 700"><span class="dm-pt">Quadro de aulas</span><span class="dm-en">Class schedule</span></h3><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5363"><span class="dm-pt">Funcionalidade no app e no site das instituições para exibir e organizar a grade de horários de estudantes e professores, bem como direcionar para os links de aulas e materiais de estudos. É uma das funcionalidades mais acessadas do Ulife, com mais de 300 mil usuários anualmente, entre alunos e professores.</span><span class="dm-en">A feature in the institutions’ app and website that displays and organizes the timetables of students and teachers, and links to class sessions and study materials. It is one of the most-used features of Ulife, with more than 300,000 users every year, including students and teachers.</span></p></li>
</ul>
</div>
</div>
</section>

<section id="cap-anima" data-chapter="1" style="background: #F7F8FA; color: #11151C; padding: clamp(64px, 8cqi, 128px) clamp(16px, 5cqi, 80px) clamp(64px, 8cqi, 128px) clamp(12px, 3cqi, 40px)">
<p style="margin: 0 0 20px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #4A5363"><span class="dm-pt">2022 · Chegada à Ânima</span><span class="dm-en">2022 · Joining Ânima</span></p>
<h2 style="margin: 0 0 28px; font-size: clamp(30px, 4.4cqi, 56px); line-height: 1.08; letter-spacing: -0.025em; font-weight: 800; max-width: 20ch"><span class="dm-pt">Mas antes, eu entrei na Ânima como UX Designer e precisava entender os produtos e processos.</span><span class="dm-en">But first, I joined Ânima as a UX Designer and needed to understand its products and processes.</span></h2>
<div style="display: flex; flex-direction: column; gap: 20px; max-width: 760px">
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">Fui designado para times que atuavam em operações complexas, com processos manuais, sistemas pouco integrados e uma linguagem técnica própria. Para desenhar bem, primeiro eu tinha que entender: mapeei fluxos, desenhei blueprints, organizei o que ouvia do time técnico e encontrei gargalos que viraram oportunidades de automação.</span><span class="dm-en">I was assigned to teams working on complex operations, with manual processes, poorly integrated systems and a technical language of their own. To design well, I first had to understand: I mapped flows, drew blueprints, organized what I heard from the technical team and found bottlenecks that became automation opportunities.</span></p>
<ul aria-label="{{tx.comp}}" style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; font-weight: 600">
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Mapeamento de fluxos</span><span class="dm-en">Flow mapping</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC">Service blueprint</li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Arquitetura de sistemas</span><span class="dm-en">Systems architecture</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Análise de volumetria</span><span class="dm-en">Volume analysis</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Wireframes e protótipos</span><span class="dm-en">Wireframes and prototypes</span></li>
</ul>
</div>
<div class="dm-cards2" style="margin-top: 56px">
<article style="display: flex; flex-direction: column; gap: 12px">
<img src="images/anima-provas.jpg" alt="Fluxos AS IS e TO BE das etapas de criação e configuração de provas" style="display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 12px">
<h3 style="margin: 0; font-size: 18px; font-weight: 700"><span class="dm-pt">Unificação de bancos de questões para configuração de provas</span><span class="dm-en">Unifying question banks for exam setup</span></h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5363"><span class="dm-pt">Estruturação do fluxo de criação e configuração de provas para identificar gargalos e oportunidades de melhorias no processo.</span><span class="dm-en">Structuring the exam creation and setup flow to identify bottlenecks and opportunities to improve the process.</span></p>
<p class="dm-note" style="margin: 4px 0 0; padding-left: 14px; border-left: 2px solid #C9D0DC; font-size: 15px; line-height: 1.6; font-style: italic; color: #2A303B"><span class="dm-pt">“A entrega final foi uma versão melhorada da tela, simples, de cadastro de questões. O ganho maior no processo se deu quando, ao mapear a sequência de ações e responsáveis no fluxo, percebeu-se grande relação de dependência às etapas anteriores de criação e configuração de componentes. Decidiu-se que os bancos de questões poderiam ser unificados e a etapa de cadastro e configuração de provas se tornaria independente das demais, ampliando o prazo de atuação dos stakeholders e aumentando a segurança e assertividade da entrega.”</span><span class="dm-en">“The final delivery was an improved version of the simple question-entry screen. The biggest process gain came when, mapping the sequence of actions and owners in the flow, we saw a strong dependency on the earlier steps of creating and setting up components. We decided the question banks could be unified and the exam entry and setup step would become independent of the others, giving stakeholders a longer window to act and making delivery safer and more accurate.”</span></p>
</article>
<article style="display: flex; flex-direction: column; gap: 12px">
<img src="images/anima-planos.jpg" alt="Estudo do fluxo atual de planos de ensino, com etapas e problemas, e o blueprint do serviço construído a partir dele" style="display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 12px">
<h3 style="margin: 0; font-size: 18px; font-weight: 700"><span class="dm-pt">Cadastro e edição de planos de ensino</span><span class="dm-en">Creating and editing course plans</span></h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5363"><span class="dm-pt">Mapeamento de um fluxo confuso, descentralizado e em grande parte manual. Foi preciso organizar o estudo visual das etapas, para um novo desenho, simplificado, e esquematização de um blueprint do serviço para organizar o desenvolvimento do produto final.</span><span class="dm-en">Mapping a confusing, decentralized and largely manual flow. It took a visual study of the steps, leading to a new, simplified design and a service blueprint to organize the development of the final product.</span></p>
<p class="dm-note" style="margin: 4px 0 0; padding-left: 14px; border-left: 2px solid #C9D0DC; font-size: 15px; line-height: 1.6; font-style: italic; color: #2A303B"><span class="dm-pt">“Existia um produto, não integrado aos sistemas, que formatava os planos. O desenvolvimento de uma nova versão deste produto foi a entrega final. Minha atuação chave, para além do desenvolvimento do protótipo e auxílio na escrita das histórias, foi ajudar a exemplificar os ganhos processuais da integração deste novo produto, reduzindo etapas e mitigando riscos do processo antigo.”</span><span class="dm-en">“There was a product, not integrated with the systems, that formatted the plans. Developing a new version of it was the final delivery. My key contribution, beyond building the prototype and helping write the user stories, was showing the process gains of integrating this new product, cutting steps and mitigating the risks of the old process.”</span></p>
</article>
<article style="display: flex; flex-direction: column; gap: 12px">
<img src="images/anima-chamados.jpg" alt="Mapeamento do fluxo atual de solicitações no Ulife e wireframes de ajustes" style="display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; border-radius: 12px">
<h3 style="margin: 0; font-size: 18px; font-weight: 700"><span class="dm-pt">Melhoria do fluxo de abertura de chamados</span><span class="dm-en">Improving the support ticket flow</span></h3>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4A5363"><span class="dm-pt">Atividade exploratória em treinamento de grupo: estudo de volumetria e separação de chamados por assunto, mapeamento da interface atual, rascunhos à mão das novas telas, wireframe e protótipo final.</span><span class="dm-en">An exploratory group training exercise: volume study and grouping of tickets by subject, mapping of the current interface, hand sketches of the new screens, wireframe and final prototype.</span></p>
<p class="dm-note" style="margin: 4px 0 0; padding-left: 14px; border-left: 2px solid #C9D0DC; font-size: 15px; line-height: 1.6; font-style: italic; color: #2A303B"><span class="dm-pt">“A atividade fez parte de um “laboratório de UX” promovido internamente, como uma iniciativa de “onboarding” e treinamento profissional. Serviu como trabalho “acadêmico” e estudo interno para correções, ajustes e melhorias futuras do processo.”</span><span class="dm-en">“The activity was part of an internal “UX lab”, an onboarding and professional training initiative. It worked as an “academic” exercise and an internal study for future fixes, adjustments and improvements to the process.”</span></p>
</article>
</div>
</section>

<section id="cap-mba" data-chapter="2" style="background: #FFFFFF; color: #11151C; padding: clamp(64px, 8cqi, 128px) clamp(16px, 5cqi, 80px) clamp(64px, 8cqi, 128px) clamp(12px, 3cqi, 40px)">
<p style="margin: 0 0 20px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #4A5363">2020–2021 · FIAP</p>
<h2 style="margin: 0 0 28px; font-size: clamp(30px, 4.4cqi, 56px); line-height: 1.08; letter-spacing: -0.025em; font-weight: 800; max-width: 20ch"><span class="dm-pt">E eu me credenciei para a vaga de UX com um MBA em UX Design &amp; Strategy.</span><span class="dm-en">And I earned the UX role with an MBA in UX Design &amp; Strategy.</span></h2>
<div class="dm-split">
<div style="display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">A profissão de designer estava mudando, e a programação visual sozinha já não bastava. Ao trabalhar ao lado de especialistas em Usabilidade, percebi que seria válido investir numa formação adicional à de designer gráfico, para melhor atuar com projetos digitais.</span><span class="dm-en">The design profession was changing, and visual design alone was no longer enough. Working alongside usability specialists, I realized it was worth investing in training beyond graphic design, to work better on digital projects.</span></p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">Inicialmente me inscrevi num MBA do Instituto Infnet, no Rio de Janeiro, mas precisei encerrá-lo e recomecei os estudos na FIAP, após me mudar para São Paulo em 2019.</span><span class="dm-en">I first enrolled in an MBA at Instituto Infnet in Rio de Janeiro, but had to leave it and started over at FIAP after moving to São Paulo in 2019.</span></p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">A formação envolveu a execução de projetos como o “Calmei”, trabalho feito em dupla, sobre a criação de um aplicativo de saúde mental, e o “Vida Plena Saúde”, projeto multidisciplinar sobre o fluxo de um serviço de agendamento de consultas online, com blueprint, fluxograma e mockups de telas.</span><span class="dm-en">The program involved projects such as “Calmei”, a project done in pairs, on creating a mental health app, and “Vida Plena Saúde”, a multidisciplinary project on the flow of an online medical appointment booking service, with a service blueprint, flowchart and screen mockups.</span></p>
<ul aria-label="{{tx.comp}}" style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; font-weight: 600">
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC">UX Strategy</li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC">Design Thinking</li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Arquitetura de informação</span><span class="dm-en">Information architecture</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Métricas de experiência</span><span class="dm-en">Experience metrics</span></li>
</ul>
</div>
<div style="display: flex; flex-direction: column; gap: 24px"><figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><img src="images/calmei-tcc.jpg" alt="Páginas do trabalho de conclusão do Calmei: pesquisa, precificação, concorrentes, mapa de empatia e protótipos" style="display: block; width: 100%; height: auto; border-radius: 6px"><figcaption style="margin: 0; font-family: 'Manrope', sans-serif; font-size: 13px; line-height: 1.4; color: #4A5363"><span class="dm-pt">Trabalho de conclusão do “Calmei”: pesquisa de mercado, precificação, análise de concorrentes, mapa de empatia e protótipos.</span><span class="dm-en">“Calmei” final project: market research, pricing, competitor analysis, empathy map and prototypes.</span></figcaption></figure><figure style="margin: 0; display: flex; flex-direction: column; gap: 10px"><img src="images/vida-plena.jpg" alt="Telas desktop e mobile do fluxo de agendamento de consultas Vida Plena Saúde" style="display: block; width: 100%; height: auto; border-radius: 6px"><figcaption style="margin: 0; font-family: 'Manrope', sans-serif; font-size: 13px; line-height: 1.4; color: #4A5363"><span class="dm-pt">Projeto “Vida Plena Saúde”: mockups das telas desktop e mobile do fluxo de agendamento de consultas online.</span><span class="dm-en">“Vida Plena Saúde” project: desktop and mobile screen mockups of the online appointment booking flow.</span></figcaption></figure></div>

</section>

<section id="cap-fiocruz" data-chapter="3" style="background: #F7F8FA; color: #11151C; padding: clamp(64px, 8cqi, 128px) clamp(16px, 5cqi, 80px) clamp(64px, 8cqi, 128px) clamp(12px, 3cqi, 40px)">
<p style="margin: 0 0 20px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #4A5363">2014–2019 · ENSP / Fiocruz</p>

<div class="dm-split">
<div style="display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">Por quase seis anos, fiz parte da equipe multidisciplinar da CDEAD, o braço de educação a distância da ENSP/Fiocruz. Criei identidades visuais, diagramação, ilustrações e materiais digitais em HTML5, sempre junto às equipes de pedagogia e design instrucional. A ordem era produzir materiais cada vez mais responsivos e acessíveis, e converter os antigos para esse novo formato.</span><span class="dm-en">For almost six years, I was part of the multidisciplinary team at CDEAD, the distance learning branch of ENSP/Fiocruz. I created visual identities, layouts, illustrations and digital materials in HTML5, always together with the pedagogy and instructional design teams. The goal was to produce ever more responsive and accessible materials, and to convert older ones to this new format.</span></p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">Também participei de grupos de estudo sobre jogos educativos, acessibilidade e transferência de tecnologia em parceria com universidades públicas. E, no mesmo período, voltei para a universidade.</span><span class="dm-en">I also took part in study groups on educational games, accessibility and technology transfer in partnership with public universities. And, during the same period, I went back to university.</span></p>

r the pedagogical proposal “Monitoramento e Avaliação para ação em saúde pública” (Monitoring and Evaluation for public health action).</span></figcaption></figure></div>

<section id="cap-uff" data-chapter="4" style="background: #FFFFFF; color: #11151C; padding: clamp(64px, 8cqi, 128px) clamp(16px, 5cqi, 80px) clamp(64px, 8cqi, 128px) clamp(12px, 3cqi, 40px)">
<p style="margin: 0 0 20px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #4A5363"><span class="dm-pt">2014–2016 · Universidade Federal Fluminense</span><span class="dm-en">2014–2016 · Fluminense Federal University</span></p>
<h2 style="margin: 0 0 28px; font-size: clamp(30px, 4.4cqi, 56px); line-height: 1.08; letter-spacing: -0.025em; font-weight: 800; max-width: 20ch"><span class="dm-pt">Enquanto desenhava na Fiocruz, eu estudava como as organizações funcionam.</span><span class="dm-en">While designing at Fiocruz, I was studying how organizations work.</span></h2>
<div class="dm-split">
<div style="display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">Fiz o ENEM ao final de 2013 e entrei, pelo SISU, em Processos Gerenciais na UFF, um curso novo que levaria minha formação para além do design e das artes. Foram três anos estudando projetos, processos, pessoas, cultura e teorias organizacionais, comunicação empresarial, planos de negócio e práticas de gestão.</span><span class="dm-en">I took Brazil’s national university entrance exam (ENEM) at the end of 2013 and was admitted to the Management Processes program at UFF, a new course that would take my education beyond design and the arts. I spent three years studying projects, processes, people, organizational culture and theory, business communication, business plans and management practices.</span></p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">Me formei com o maior CR da turma e no projeto final apresentei um plano de negócios para lançar um e-commerce de moda.</span><span class="dm-en">I graduated with the highest GPA in my class, and for my final project I presented a business plan to launch a fashion e-commerce.</span></p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #2A303B"><span class="dm-pt">É dessa formação que vem o meu olhar para o contexto organizacional, e o que hoje me permite contribuir além das entregas de design, nas conversas com stakeholders e nas decisões de produto.</span><span class="dm-en">This background is where my eye for the organizational context comes from, and it is what lets me contribute beyond design deliverables today, in conversations with stakeholders and in product decisions.</span></p>

<section id="cap-inicio" data-chapter="7" style="background: #F7F8FA; color: #11151C; padding: clamp(64px, 8cqi, 128px) clamp(16px, 5cqi, 80px) clamp(64px, 8cqi, 112px) clamp(12px, 3cqi, 40px)">
<p style="margin: 0 0 20px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #4A5363"><span class="dm-pt">2004–2009 · O começo</span><span class="dm-en">2004–2009 · The beginning</span></p>
<h2 style="margin: 0 0 28px; font-size: clamp(30px, 4.4cqi, 56px); line-height: 1.08; letter-spacing: -0.025em; font-weight: 800; max-width: 20ch"><span class="dm-pt">E foi em pequenas agências que tudo começou.</span><span class="dm-en">And it all began in small agencies.</span></h2>
<p style="margin: 0; max-width: 760px; font-family: 'Libre Caslon Text', serif; font-size: 18px; line-height: 1.65; color: #2A303B"><span class="dm-pt">Comecei com o curso técnico em Design Gráfico na Estácio (2004–2006) e, ainda durante ele, o primeiro estágio na POR5INCO (2005–2006): identidades visuais, ilustração, produção gráfica e os primeiros sites. Depois vieram a graduação em Desenho Industrial, também na Estácio (2007–2009), com um projeto editorial sobre quadrinhos como trabalho final, e o estágio na Artwork Comunicação (2008–2009), entre identidades, anúncios e impressos de grande formato. As duas eram agências de pequeno porte, com clientes e briefings muito variados: uma ótima escola de versatilidade para quem estava começando.</span><span class="dm-en">I started with a technical course in Graphic Design at Estácio (2004–2006) and, while still in it, my first internship at POR5INCO (2005–2006): visual identities, illustration, print production and my first websites. Then came my degree in Industrial Design, also at Estácio (2007–2009), with an editorial project about comics as my final work, and an internship at Artwork Comunicação (2008–2009), working on identities, ads and large-format print. Both were small agencies with very varied clients and briefs: a great school of versatility for someone just starting out.</span></p>
<ul aria-label="{{tx.comp}}" style="list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600">
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Produção gráfica</span><span class="dm-en">Print production</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Grandes formatos</span><span class="dm-en">Large formats</span></li>
<li style="padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D0DC"><span class="dm-pt">Design gráfico</span><span class="dm-en">Graphic design</span></li>
